.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 18px; border-radius: 999px; font-size: 13px; z-index: 30; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

}

];

try { const p = localStorage.getItem('demoB.page'); if (p) state.page = p; } catch (e) {}

const $ = s => document.querySelector(s);

const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);

const live = () => posts.filter(p => !p.irrelevant);

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);

function feed() {
  const all = live();
  const neg = all.filter(p => p.sent === 'neg');
  const open = neg.filter(p => !p.done).length;
  const list = all.filter(p => (state.group === 'all' || p.g === state.group)
    && (state.sent === 'all' || p.sent === state.sent)
    && (state.plat === 'all' || p.plat === state.plat)
    && (state.showDone || !p.done));
  const pb = (k, v, l) => `<button data-f="${k}" data-v="${v}" aria-pressed="${state[k] === v}">${l}</button>`;

  <div class="cards">${list.length ? list.map(card).join('') : '<div class="empty">这里暂时没有内容。</div>'}</div>`;
}

function card(p) {
  const g = groups.find(x => x.id === p.g);
  return `<article class="card ${p.sent === 'neg' ? 'neg' : ''} ${p.done ? 'done' : ''}">
    <div class="c-head">
      <span class="badge b-${p.plat}" aria-label="${PLATS[p.plat]}">${SHORT[p.plat]}</span>
      <div class="who"><b>${esc(p.author)}</b><small>${PLATS[p.plat]} · ${p.time}</small></div>
      <span class="mood ${p.sent}">${SENT[p.sent]}</span>
    </div>
    ${p.title ? `<h3>${hl(p.title, p.kw)}</h3>` : ''}
    <p class="body">${hl(p.body, p.kw)}</p>
    <div class="tags">
      <span class="tag2">${esc(g.name)} · ${esc(p.kw)}</span>
      ${p.alerted ? '<span class="tag2 alert">已推送预警</span>' : ''}
      ${p.similar ? `<span class="tag2">另有 ${p.similar} 条相似</span>` : ''}
      ${p.done ? '<span class="tag2">已处理</span>' : ''}
    </div>
    <div class="c-foot">
      <span>赞 <span class="n">${fmt(p.likes)}</span></span><span>评 <span class="n">${fmt(p.cmts)}</span></span><span>转 <span class="n">${fmt(p.shares)}</span></span>
      <div class="acts">
        ${p.alerted ? `<button data-act="wx" data-id="${p.id}">推送详情</button>` : ''}
        <button data-act="fix" data-id="${p.id}">纠正情感</button>
        <button data-act="irr" data-id="${p.id}">不相关</button>
        <button class="main" data-act="done" data-id="${p.id}">${p.done ? '撤销' : '已处理'}</button>
      </div>
    </div>
  </article>`;
}

function keywords() {
  return `
  <div class="sect-title" style="margin-top:8px"><h2>关键词组</h2><span>${groups.length} / 3 组 · 每组最多 20 个词</span>
    <button class="primary" data-act="newGroup" ${groups.length >= 3 ? 'disabled title="试用套餐最多 3 组"' : ''}>新建</button></div>
  <div class="cards">
    ${groups.map(g => `<div class="card kw-row">
      <div class="info">
        <h3>${esc(g.name)}</h3>
        <div class="words">${g.words.map(w => `<span class="w">${esc(w)}</span>`).join('')}${g.exclude.map(w => `<span class="w ex">${esc(w)}</span>`).join('')}</div>
        <div class="line">${g.plats.map(k => `<span class="dot d-${k}"></span>${PLATS[k]}`).join(' ')} · 今日命中 ${live().filter(p => p.g === g.id).length} 条 ·
          <button class="textbtn" data-act="del" data-id="${g.id}" style="font-size:12px">删除</button></div>
      </div>
      <button class="toggle" role="switch" aria-checked="${g.on}" aria-label="启用 ${esc(g.name)}" data-act="tg" data-id="${g.id}"></button>
    </div>`).join('')}
  </div>
  <p style="color:var(--muted);font-size:12px;margin-top:14px">监测词之间为“或”；同时包含排除词的内容会被丢弃。新建关键词组后会自动回溯近 3 天的内容。</p>`;
}

function settings() {
  return `
  <div class="sect-title" style="margin-top:8px"><h2>设置</h2></div>
  <p class="gl-title">预警推送 · 负面内容命中后立即推送</p>
  <div class="group-list">${channels.map(c => `<div class="gl-item"><div class="txt">${c.name}<small>${esc(c.addr)}</small></div>
    <button class="toggle" role="switch" aria-checked="${c.on}" aria-label="启用 ${c.name}" data-act="ch" data-id="${c.id}"></button></div>`).join('')}
    <div class="gl-item"><div class="txt">免打扰时段<small>时段内的预警在结束后合并推送</small></div>
      <input class="field time" type="time" id="qs" value="23:00" aria-label="开始"> – <input class="field time" type="time" id="qe" value="08:00" aria-label="结束"></div>
    <div class="gl-item"><div class="txt">发送一条测试预警<small>检查机器人和邮箱是否能收到</small></div><button class="ghost" data-act="test">发送</button></div>
  </div>
  <p class="gl-title">成员 · ${members.length} 人</p>
  <div class="group-list">${members.map(m => `<div class="gl-item"><span class="ava">${m.name[0]}</span><div class="txt">${m.name}<small>${m.phone}</small></div><span class="role">${m.role}</span></div>`).join('')}
    <form class="gl-item" id="inv"><input class="field" id="invPhone" inputmode="tel" placeholder="输入手机号邀请成员"><button class="primary">邀请</button></form>
  </div>
  <p class="gl-title">套餐</p>
  <div class="group-list"><div class="gl-item"><div class="txt">MVP 试用 · 山岚咖啡（示例租户）<small>3 个关键词组 · 4 个平台 · 剩余 23 天</small></div></div></div>`;
}

function render() {
  document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-current', b.dataset.page === state.page ? 'page' : 'false'));
  $('#main').innerHTML = state.page === 'feed' ? feed() : state.page === 'keywords' ? keywords() : settings();
}

function sheet(html) { $('#layer').innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div></div>`; const f = $('#layer input, #layer select, #layer button'); if (f) f.focus(); }
const close = () => { $('#layer').innerHTML = ''; };

document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.close) return close();
  const nav = e.target.closest('[data-page]');
  if (nav) { state.page = nav.dataset.page; try { localStorage.setItem('demoB.page', state.page); } catch (err) {} close(); render(); window.scrollTo(0, 0); return; }
  const f = e.target.closest('[data-f]');
  if (f) { state[f.dataset.f] = f.dataset.v; render(); return; }
  if (e.target.id === 'export') { toast('演示版暂不导出，正式版导出当前筛选结果'); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id, act = a.dataset.act, p = posts.find(x => x.id === Number(id));
  if (act === 'cancel') return close();
  if (act === 'origin') { e.preventDefault(); toast('演示版不跳转原文'); return; }
  if (act === 'irr') { p.irrelevant = true; toast('已标记不相关'); }
  if (act === 'done') { p.done = !p.done; toast(p.done ? '已标记为已处理' : '已撤销'); }
  if (act === 'fix') {
    return sheet(`<h2>纠正情感</h2><p style="color:var(--muted);margin:-8px 0 14px;font-size:13px">${esc(p.body.slice(0, 36))}…</p>
      <form id="fixForm" data-id="${p.id}"><div class="plats">${Object.entries(SENT).map(([k, v]) => `<label><input type="radio" name="s" value="${k}" ${p.sent === k ? 'checked' : ''}>${v}</label>`).join('')}</div>
      <div class="acts"><button type="button" class="ghost" data-act="cancel">取消</button><button class="primary">保存</button></div></form>`);
  }
  if (act === 'wx') {
    return sheet(`<h2>推送详情</h2><div class="wx"><b>【负面预警】${esc(groups.find(g => g.id === p.g).name)} · ${PLATS[p.plat]}</b>
      <span>作者：${esc(p.author)}</span><span>摘录：${esc(p.body.slice(0, 40))}…</span><span>互动：赞 ${fmt(p.likes)} · 评 ${fmt(p.cmts)} · 转 ${fmt(p.shares)}</span>
      <span><a href="#" data-act="origin">查看原文</a></span></div>
      <p style="color:var(--muted);font-size:12px">已发送到：企业微信群机器人、邮件 · 发布后 6 分钟送达</p>
      <div class="acts" style="display:flex;justify-content:flex-end"><button class="ghost" data-act="cancel">关闭</button></div>`);
  }
  if (act === 'newGroup') {
    return sheet(`<h2>新建关键词组</h2><form id="ng">
      <label>名称<input class="field" id="ngName" placeholder="例如：秋季新品"></label>
      <label>监测词（用逗号分隔，最多 20 个）<input class="field" id="ngWords" placeholder="山岚 新品, 桂花拿铁"></label>
      <label>排除词（选填）<input class="field" id="ngEx" placeholder="招聘, 转让"></label>
      <div class="plats">${Object.entries(PLATS).map(([k, v]) => `<label><input type="checkbox" id="ng-${k}" checked>${v}</label>`).join('')}</div>
      <div class="err" id="ngErr"></div>
      <div class="acts"><button type="button" class="ghost" data-act="cancel">取消</button><button class="primary">开始监测</button></div></form>`);
  }
  if (act === 'del') { const i = groups.findIndex(g => g.id === id); toast(`已删除「${groups[i].name}」`); groups.splice(i, 1); }
  if (act === 'tg') { const g = groups.find(x => x.id === id); g.on = !g.on; toast(g.on ? `已启用「${g.name}」` : `已暂停「${g.name}」`); }
  if (act === 'ch') { const c = channels.find(x => x.id === id); if (c.addr === '未配置') { toast('请先填写飞书机器人地址'); return; } c.on = !c.on; }
  if (act === 'test') { toast('测试预警已发送'); return; }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'showDone') { state.showDone = e.target.checked; render(); }
  if (e.target.id === 'qs' || e.target.id === 'qe') toast(`免打扰时段：${$('#qs').value} – ${$('#qe').value}`);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const t = e.target;
  if (t.id === 'fixForm') { const v = t.querySelector('input[name="s"]:checked').value; posts.find(p => p.id === Number(t.dataset.id)).sent = v; close(); toast('已纠正，将用于优化模型'); render(); }
  if (t.id === 'ng') {
    const name = $('#ngName').value.trim();
    const words = $('#ngWords').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const ex = $('#ngEx').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const plats = Object.keys(PLATS).filter(k => $('#ng-' + k).checked);
    if (!name || !words.length) { $('#ngErr').textContent = '请填写名称和至少一个监测词。'; return; }
    if (words.length > 20) { $('#ngErr').textContent = '每组最多 20 个监测词。'; return; }
    if (!plats.length) { $('#ngErr').textContent = '至少选择一个平台。'; return; }
    groups.push({ id: 'g' + Date.now(), name, words, exclude: ex, plats, on: true });
    close(); toast(`「${name}」已开始监测，正在回溯近 3 天`); render();
  }
  if (t.id === 'inv') {
    const v = $('#invPhone').value.trim();
    if (!/^1\d{10}$/.test(v)) { toast('请输入 11 位手机号'); return; }
    members.push({ name: '新成员', role: '成员', phone: v.slice(0, 3) + '****' + v.slice(7) });
    toast('邀请短信已发送（演示）'); render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
render();
</script>
